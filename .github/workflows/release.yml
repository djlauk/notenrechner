name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write   # Release erstellen

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Abhängigkeiten installieren
        run: pip install -e ".[dev]"
      - name: Tests ausführen
        run: pytest
      - name: ZIP bauen
        run: git archive --format=zip --prefix=notenrechner/ -o "notenrechner-$GITHUB_REF_NAME.zip" HEAD
      - name: Release erstellen
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release create "$GITHUB_REF_NAME" "notenrechner-$GITHUB_REF_NAME.zip" --generate-notes
