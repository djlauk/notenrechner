name: Tests

on:
  push:
  pull_request:

permissions:
  contents: read
  issues: write   # nur nötig für den Issue-Step am Ende

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Abhängigkeiten installieren
        run: pip install -e ".[dev]"
      - name: Tests ausführen
        run: pytest                 # Exit-Code ≠ 0 → Step rot → Job rot
      - name: Bei Fehler auf main ein Issue erstellen
        if: failure() && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh issue create \
            --title "Tests fehlgeschlagen auf main ($(git rev-parse --short HEAD))" \
            --body "Der Testlauf ist fehlgeschlagen: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
