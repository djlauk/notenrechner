[project]
name = "notenrechner"
version = "0.1.0"
description = "Kleines CLI-Tool: rechnet Punkte in eine Note (Skala 1-6) um."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Daniel J. Lauk" }]
requires-python = ">=3.10"
dependencies = []

[project.scripts]
notenrechner = "notenrechner.cli:main"

[project.optional-dependencies]
dev = ["pytest>=8"]
docs = ["mkdocs>=1.6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/notenrechner"]

[tool.pytest.ini_options]
testpaths = ["tests"]
